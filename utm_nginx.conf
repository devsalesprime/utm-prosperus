server {
    listen 80;
    server_name utm.prosperusclub.com.br;

    root /var/www/utm.prosperusclub.com.br;

    # Backend API endpoints
    location /api/ {
        alias /var/www/utm.prosperusclub.com.br/backend/api/;
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # Redirect /go.php
    location = /go.php {
        alias /var/www/utm.prosperusclub.com.br/backend/go.php;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    # Intercept /go/CODE
    location ~* ^/go/(.+)$ {
        rewrite ^/go/(.+)$ /redirect.php?code=$1 last;
    }

    # Redirect /redirect.php
    location = /redirect.php {
        alias /var/www/utm.prosperusclub.com.br/backend/redirect.php;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    # Default location - Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
